<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes" />
    <title>vcf-autocomplete demo</title>
    <link rel="stylesheet" href="/node_modules/@vaadin/vaadin-lumo-styles/lumo.css">
    <style>
     .centered {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
      }
      main {
        opacity: 1;
        transition: opacity 0.5s;
      }
      main.hidden {
        opacity: 0;
      }
      h3 {
        padding: 10px;        
        background-color: #f4f5f6;
        margin-bottom: 8px;
      }
      h3 :first-of-type {
        margin-top: 20px;
      }
      hr {
        margin-top: 30px;
      }
      #api {
        text-align: right;
        margin-bottom: 20px;
      }
    </style>
    <script type="module">
      // import '../theme/lumo/vcf-autocomplete.js';
    </script>   
  </head>
  <body>
    <main class="centered hidden">

      <h4 id="api"><a href="../#/elements/vcf-autocomplete">API documentation ↗</a></h4>

      <h3>Autocomplete - Basic Demo</h3>
      <vcf-autocomplete id="demo1" label="Choose country" placeholder="Start typing a country name..."> </vcf-autocomplete>

      <div>
        Last applied value:
        <span id="lastAppliedValue">
          None
        </span>
      </div>

      <script>
        function getData(callback) {
          var xhr = new XMLHttpRequest();
          xhr.onload = function () {
            callback(JSON.parse(xhr.responseText));
          };
          var url = 'https://demo.vaadin.com/demo-data/1.0/countries';
          xhr.open('GET', url, true);
          xhr.send();
        }
      </script>

      <hr>   
      <h3>Autocomplete - Slow API Demo</h3>
      <vcf-autocomplete id="demo2" label="Choose country" placeholder="Start typing a country name..."> </vcf-autocomplete>

      <script>
        let countriesDemo2 = [];

        function filterByValue(items, value) {
          return items.filter((item) => item.toLowerCase().indexOf(value.toLowerCase()) === 0);
        }

        function getDataDefer(callback, value) {
          if (!countriesDemo2.length) {
            var xhr = new XMLHttpRequest();
            xhr.onload = function () {
              countriesDemo2 = JSON.parse(xhr.responseText);
              setTimeout(() => callback(filterByValue(countriesDemo2, value)), 1000);
            };
            var url = 'https://demo.vaadin.com/demo-data/1.0/countries';
            xhr.open('GET', url, true);
            xhr.send();
          } else {
            setTimeout(() => callback(filterByValue(countriesDemo2, value)), 500);
          }
        }
      </script>
    </main>

    <script type="module">
      document.querySelector('main').classList.remove('hidden');

      const autocompleteElementDemo1 = document.querySelector('#demo1');
      let countriesDemo1 = [];

      getData((result) => {
        countriesDemo2 = result;
      });

      autocompleteElementDemo1.addEventListener('value-changed', (ev) => {
        if (countriesDemo2.length) {
          autocompleteElementDemo1.options = countriesDemo2.filter((country) => country.toLowerCase().indexOf(ev.detail.value.toLowerCase()) >= 0);
        }
      });

      autocompleteElementDemo1.addEventListener('vcf-autocomplete-value-applied', (ev) => {
        document.getElementById('lastAppliedValue').textContent = ev.detail.value;
      });

      const autocompleteElementDemo2 = document.querySelector('#demo2');
      autocompleteElementDemo2.addEventListener('value-changed', (ev) => {
        if (ev.detail.value.length > 0) {
          autocompleteElementDemo2.loading = true;
          getDataDefer((res) => {
            autocompleteElementDemo2.options = res;
            autocompleteElementDemo2.loading = false;
          }, ev.detail.value);
        }
      });
    </script>

  </body>
</html>
